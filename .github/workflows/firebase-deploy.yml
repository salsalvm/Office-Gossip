name: Firebase deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: firebase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FIREBASE_PROJECT: office-gossip
  NODE_VERSION: 22
  # Pull requests only build; pushes to main (including merges) and manual runs deploy.
  DEPLOY: ${{ github.event_name != 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # Manual runs deploy everything.
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      admin: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.admin == 'true' }}
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@v4
      - if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - firebase.json
              - .firebaserc
              - .github/workflows/firebase-deploy.yml
            web:
              - *shared
              - frontend-web/**
            admin:
              - *shared
              - admin-web/**
            backend:
              - *shared
              - backend/**

  web:
    name: Frontend (office-gossip.web.app)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
        working-directory: frontend-web
      - run: npm run build
        working-directory: frontend-web
      - if: env.DEPLOY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - if: env.DEPLOY == 'true'
        run: npx --yes firebase-tools@latest deploy --only hosting:web --project "$FIREBASE_PROJECT" --non-interactive

  admin:
    name: Admin (office-gossip-admin.web.app)
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
        working-directory: admin-web
      - run: npm run build
        working-directory: admin-web
      - if: env.DEPLOY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - if: env.DEPLOY == 'true'
        run: npx --yes firebase-tools@latest deploy --only hosting:admin --project "$FIREBASE_PROJECT" --non-interactive

  backend:
    name: API (office-gossip-api.web.app)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - if: env.DEPLOY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - if: env.DEPLOY == 'true'
        run: npx --yes firebase-tools@latest deploy --only functions:api,hosting:api --project "$FIREBASE_PROJECT" --non-interactive --force
