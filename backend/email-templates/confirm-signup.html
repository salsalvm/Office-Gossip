<!-- Supabase → Authentication → Emails → Confirm signup. Subject: Welcome to Office Gossip — your code: {{ .Token }} -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Welcome to Office Gossip</title>
</head>
<body style="margin:0;padding:0;background:#f4f2fd;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1d1b2f;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Welcome! Your verification code is {{ .Token }}.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f2fd;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
        <tr><td align="center" style="padding-bottom:20px;">
          <table role="presentation" cellpadding="0" cellspacing="0"><tr>
            <td style="width:40px;height:40px;background:#7357E8;border-radius:11px;color:#ffffff;font-weight:800;font-size:15px;text-align:center;letter-spacing:-0.5px;">OG</td>
            <td style="padding-left:10px;font-size:20px;font-weight:800;color:#1d1b2f;">office<span style="color:#7357E8;">gossip</span></td>
          </tr></table>
        </td></tr>
        <tr><td style="background:#ffffff;border-radius:24px;padding:36px 32px;box-shadow:0 12px 40px rgba(60,40,140,0.08);">
          <h1 style="margin:0 0 10px;font-size:24px;line-height:1.3;font-weight:800;color:#1d1b2f;">Welcome to Office Gossip 👋</h1>
          <p style="margin:0 0 26px;font-size:15px;line-height:1.6;color:#5d5a72;">Use this code to confirm <b style="color:#1d1b2f;">{{ .Email }}</b> and finish creating your account.</p>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
            <td align="center" style="background:#f4f2fd;border:1px dashed #c9bdf7;border-radius:16px;padding:20px 12px;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:34px;font-weight:800;letter-spacing:10px;color:#7357E8;">{{ .Token }}</td>
          </tr></table>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:26px;border-top:1px solid #eeebf8;"><tr><td align="center" style="padding-top:22px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#7357E8;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:13px 28px;border-radius:12px;">Confirm my email</a>
          </td></tr></table>
        </td></tr>
        <tr><td style="padding:22px 12px 0;font-size:12px;line-height:1.6;color:#9a97ad;text-align:center;">
          Didn’t sign up? You can safely ignore this email.<br>© Office Gossip
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
